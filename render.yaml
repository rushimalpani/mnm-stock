# Render Blueprint — backend API
# Docs: https://docs.render.com/blueprint-spec
#
# Set MONGODB_URI in the Render dashboard (secret). Stock + PDFs live in Atlas.

services:
  - type: web
    name: mnm-stock-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mnm_stock
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.0"
